#============================================================================================
# https://github.com/zhb7670/OpenWrt-X96MaxPlus-N1
#
# Description: Build OpenWrt system image from SOURCE (full-featured firmware)
#              源码编译路线 —— 覆盖原固件全部菜单（只能多不能少）
#
# Base:        https://github.com/ophub/amlogic-s9xxx-openwrt
# Source:      https://github.com/coolsnowwolf/lede  (branch: master)
#
# 硬件：只做 X96 Max+ (S905X3) 与 Phicomm N1 (S905D)
# ============================================================================================

name: Build OpenWrt from Source (X96Max+ / N1)

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: "Source branch (config/<name> directory)"
        required: true
        default: "lede_master"
        type: choice
        options:
          - lede_master
      openwrt_board:
        description: "Device board(s), underscore separated (s905x3 = X96Max+, s905d = N1)"
        required: false
        default: "s905x3_s905d"
      openwrt_kernel:
        description: "Kernel version (auto_kernel=true overrides to latest stable)"
        required: false
        default: "6.12.y_6.18.y"
        type: choice
        options:
          - 6.12.y_6.18.y
          - 6.1.y_6.12.y
          - 6.18.y
          - 6.12.y
      auto_kernel:
        description: "Auto use the latest stable kernel"
        required: false
        default: true
        type: boolean
      kernel_repo:
        description: "Kernel repository"
        required: false
        default: "ophub/kernel"
        type: choice
        options:
          - ophub/kernel
      kernel_usage:
        description: "Stable kernel tags"
        required: false
        default: "stable"
        type: choice
        options:
          - stable
          - flippy
          - beta
      openwrt_ip:
        description: "Default LAN IP"
        required: false
        default: "192.168.1.1"
      use_ccache:
        description: "Use ccache (REQUIRED for fast incremental rebuilds)"
        required: false
        default: true
        type: boolean
      openwrt_storage:
        description: "Image storage type"
        required: false
        default: "save"
        type: choice
        options:
          - save
          - temp
      builder_name:
        description: "Builder signature"
        required: false
        default: "zhb7670"

env:
  FEEDS_CONF: config/${{ inputs.source_branch }}/feeds.conf.default
  CONFIG_FILE: config/${{ inputs.source_branch }}/config
  DIY_P1_SH: config/${{ inputs.source_branch }}/diy-part1.sh
  DIY_P2_SH: config/${{ inputs.source_branch }}/diy-part2.sh
  TZ: Etc/UTC
  CCACHE_DIR: /builder/openwrt/.ccache

jobs:
  build:
    runs-on: ubuntu-24.04
    # GitHub hard limit is 6h (360min). Leave 5min margin for cleanup/upload.
    timeout-minutes: 355
    permissions:
      contents: write
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize the build environment
        id: init
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker rmi -f $(docker images -q) 2>/dev/null || true
          [[ -n "${AGENT_TOOLSDIRECTORY}" ]] && sudo rm -rf "${AGENT_TOOLSDIRECTORY}"
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android 2>/dev/null
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo -E apt-get -y update
          sudo -E apt-get -y purge azure-cli ghc* zulu* llvm* firefox google* dotnet* powershell openjdk* mongodb* moby* || true
          sudo -E apt-get -y install $(curl -fsSL https://ophub.org/ubuntu2404-make-openwrt-depends)
          sudo -E systemctl daemon-reload
          sudo -E apt-get -y autoremove --purge
          sudo -E apt-get clean
          sudo sed -i '/NVM_DIR/d;/skel/d' /root/{.bashrc,.profile}
          sudo rm -rf ~/{.cargo,.dotnet,.rustup}
          sudo -E timedatectl set-timezone "${TZ:-Etc/UTC}"
          sudo -E ntpdate ntp.ubuntu.com 0.pool.ntp.org || true
          sudo -E timedatectl set-ntp true
          date -u
          timedatectl status || true
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Create virtual disk for extended storage
        run: |
          mnt_size=$(expr $(df -h /mnt | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 1)
          root_size=$(expr $(df -h / | tail -1 | awk '{print $4}' | sed 's/[[:alpha:]]//g' | sed 's/\..*//') - 4)
          sudo truncate -s "${mnt_size}"G /mnt/mnt.img
          sudo truncate -s "${root_size}"G /root.img
          sudo losetup /dev/loop6 /mnt/mnt.img
          sudo losetup /dev/loop7 /root.img
          sudo pvcreate /dev/loop6
          sudo pvcreate /dev/loop7
          sudo vgcreate github /dev/loop6 /dev/loop7
          sudo lvcreate -n runner -l 100%FREE github
          sudo mkfs.xfs -f -i sparse=0 -b size=4096 /dev/github/runner
          sudo mkdir -p /builder
          sudo mount /dev/github/runner /builder
          sudo chown -R runner:runner /builder
          df -Th
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Clone source code [ ${{ inputs.source_branch }} ]
        id: codes
        working-directory: /builder
        if: ${{ steps.init.outputs.status == 'success' && !cancelled() }}
        run: |
          if [[ "${{ inputs.source_branch }}" =~ ^openwrt ]]; then
              REPO_URL="https://github.com/openwrt/openwrt"
          elif [[ "${{ inputs.source_branch }}" =~ ^lede ]]; then
              REPO_URL="https://github.com/coolsnowwolf/lede"
          elif [[ "${{ inputs.source_branch }}" =~ ^immortalwrt ]]; then
              REPO_URL="https://github.com/immortalwrt/immortalwrt"
          else
              echo "Error: Unknown source code repository."
              exit 1
          fi
          source_branch_input="${{ inputs.source_branch }}"
          REPO_NAME="${source_branch_input%_*}"
          REPO_BRANCH="${source_branch_input##*_}"

          git clone -q --single-branch --depth=1 --branch=${REPO_BRANCH} ${REPO_URL} openwrt
          ln -sf /builder/openwrt ${{ github.workspace }}/openwrt
          ln -sf /builder/openwrt /home/runner/work/_actions/zhb7670/amlogic-s9xxx-openwrt/main/openwrt

          echo "build_tag=OpenWrt_X96MaxPlus_N1_${source_branch_input}_$(date +"%Y.%m.%d")" >> ${GITHUB_ENV}
          echo -e "REPO_URL: [ ${REPO_URL} ]\nREPO_BRANCH: [ ${REPO_BRANCH} ]\nREPO_NAME: [ ${REPO_NAME} ]"
          df -hT ${PWD}
          echo "REPO_URL=${REPO_URL}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO_NAME}" >> ${GITHUB_ENV}
          echo "REPO_BRANCH=${REPO_BRANCH}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Load custom feeds
        run: |
          [[ -f "${FEEDS_CONF}" ]] && cp -f ${FEEDS_CONF} openwrt/feeds.conf.default
          chmod +x ${DIY_P1_SH}
          cd openwrt/
          ${{ github.workspace }}/${DIY_P1_SH}

      - name: Update feeds
        run: cd openwrt/ && ./scripts/feeds update -a

      - name: Install feeds
        run: cd openwrt/ && ./scripts/feeds install -a

      - name: Load custom configuration
        run: |
          [[ -d "files" ]] && mv -f files openwrt/files
          [[ -e "${CONFIG_FILE}" ]] && cp -f ${CONFIG_FILE} openwrt/.config
          chmod +x ${DIY_P2_SH}
          cd openwrt/
          ${{ github.workspace }}/${DIY_P2_SH} "${{ inputs.openwrt_ip }}" "${{ inputs.use_ccache }}"

      - name: Download package
        id: package
        run: |
          cd openwrt/
          make defconfig
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm -f {} \;

      - name: Get OpenWrt source commit hash
        id: openwrthash
        run: |
          # Derive a cache-busting hash without any API auth (public repo):
          # use the latest commit of the cloned source via git.
          cd /builder/openwrt
          source_hash="$(git rev-parse HEAD 2>/dev/null || echo "")"
          [[ -z "${source_hash}" ]] && source_hash="${{ github.sha }}"
          echo "source_hash=${source_hash}" >> ${GITHUB_ENV}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: /builder/openwrt/.ccache
          key: openwrt-${{ env.REPO_NAME }}-${{ env.source_hash }}
          restore-keys: |
            openwrt-${{ env.REPO_NAME }}-

      - name: Compile the OpenWrt firmware
        id: compile
        timeout-minutes: 330
        run: |
          cd openwrt/
          echo -e "Compiling with $(nproc) threads"
          echo -e "Start time: $(date -u)"

          # ---- 软超时保护 ----
          # GitHub 单 job 硬限 6h(360m)。用 timeout 320m 包裹 make，
          # 让 make 在被 GitHub kill 之前【主动退出】，
          # 从而能正常执行后续步骤(保存 ccache)，避免进度全丢。
          set +e
          timeout --signal=SIGINT --kill-after=120s 320m \
            bash -c 'make -j$(($(nproc) + 1)) V=s || make -j1 || make -j1 V=s'
          MAKE_RC=$?
          set -e

          if [[ ${MAKE_RC} -eq 124 || ${MAKE_RC} -eq 130 ]]; then
            echo "::warning::Compile hit the 320m soft timeout - interrupt was intentional."
            echo "::warning::ccache will still be saved so the next run resumes fast."
            echo "timed_out=true" >> ${GITHUB_OUTPUT}
          elif [[ ${MAKE_RC} -ne 0 ]]; then
            echo "::error::Compile failed with exit code ${MAKE_RC}"
            echo "timed_out=false" >> ${GITHUB_OUTPUT}
            echo "status=failed" >> ${GITHUB_OUTPUT}
            echo "ccache stats:"; ccache -s 2>/dev/null || true
            exit 1
          else
            echo "timed_out=false" >> ${GITHUB_OUTPUT}
          fi

          echo -e "ccache statistics:"
          ccache -s 2>/dev/null || true
          echo -e "ccache directory size:"
          du -sh $(pwd)/.ccache 2>/dev/null || echo "No ccache directory found."
          echo -e "End time: $(date -u)"

          # 若成功编出 rootfs，标记成功
          if ls bin/targets/*/*/*rootfs.tar.gz >/dev/null 2>&1; then
            echo "status=success" >> ${GITHUB_OUTPUT}
          else
            echo "status=failed" >> ${GITHUB_OUTPUT}
          fi

      - name: Save ccache (always, even on timeout/failure)
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /builder/openwrt/.ccache
          key: openwrt-${{ env.REPO_NAME }}-${{ env.source_hash }}-${{ github.run_id }}

      - name: Timeout report
        if: always() && steps.compile.outputs.timed_out == 'true'
        run: |
          echo "::notice::=============================================="
          echo "::notice::COMPILE HIT SOFT TIMEOUT (320 minutes)."
          echo "::notice::This is EXPECTED for a first cold build (250+ packages)."
          echo "::notice::ccache has been saved. Simply RE-RUN this workflow -"
          echo "::notice::the next run will reuse the cache and finish fast."
          echo "::notice::=============================================="

      - name: Clean up build files and reclaim disk space
        id: clean
        if: ${{ steps.compile.outputs.status == 'success' && !cancelled() }}
        run: |
          cd openwrt/
          [[ -d "output" ]] || mkdir output
          cp -f bin/targets/*/*/*rootfs.tar.gz output/
          cp -f .config output/config
          ls -A | grep -vE '^(output|\.ccache)$' | xargs rm -rf || true

          df -hT ${PWD}
          echo "status=success" >> ${GITHUB_OUTPUT}

      - name: Upload OpenWrt rootfs to Release
        uses: ncipollo/release-action@v1
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: openwrt/output/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: false

      - name: Package OpenWrt for target boards
        if: ${{ steps.clean.outputs.status == 'success' && !cancelled() }}
        uses: zhb7670/amlogic-s9xxx-openwrt@main
        with:
          openwrt_path: openwrt/output/*rootfs.tar.gz
          openwrt_ip: ${{ inputs.openwrt_ip }}
          openwrt_board: ${{ inputs.openwrt_board }}
          openwrt_kernel: ${{ inputs.openwrt_kernel }}
          auto_kernel: ${{ inputs.auto_kernel }}
          kernel_repo: ${{ inputs.kernel_repo }}
          kernel_usage: ${{ inputs.kernel_usage }}
          builder_name: ${{ inputs.builder_name }}

      - name: Upload packaged OpenWrt to Release
        uses: ncipollo/release-action@v1
        if: ${{ env.PACKAGED_STATUS == 'success' && !cancelled() }}
        with:
          tag: ${{ env.build_tag }}
          artifacts: ${{ env.PACKAGED_OUTPUTPATH }}/*
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
          skipIfReleaseExists: false
          body: |
            ### OpenWrt for X96 Max+ / Phicomm N1  (源码编译 · 全功能版)

            - Source: `coolsnowwolf/lede` (master)
            - Board: `s905x3` (X96 Max+), `s905d` (N1)
            - Default IP: `192.168.1.1` / user `root` / pass `password`
            - Build: `${{ inputs.source_branch }}` @ $(date -u)

            #### Hardware matrix
            | Device | SoC | DTB | WiFi |
            |---|---|---|---|
            | X96 Max+ | S905X3 | meson-sm1-x96-max-plus-100m.dtb | RTL8822CS |
            | Phicomm N1 | S905D | meson-gxl-s905d-phicomm-n1.dtb | BCM43455 |

            #### Install
            - Write `*.img` to SD/USB with balenaEtcher / Rufus / dd
            - Boot from SD → login → `System` → `Amlogic Service` → `Install OpenWrt to eMMC`

            #### 功能范围
            复刻原固件全部 LuCI 菜单（115+ 项），含：
            PassWall/PassWall2/OpenClash/SSR-Plus/AdGuardHome/MosDNS/Docker/
            qBittorrent/Transmission/Aria2/Alist/可道云/Frpc/Frps/KMS/
            OpenVPN/IPSec/PPTP/SoftEther/N2N/ZeroTier/微力同步 等。
